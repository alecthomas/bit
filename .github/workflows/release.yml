on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
name: Release
jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.target-suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target-suffix: unknown-linux-gnu
          - runner: ubuntu-latest
            arch: aarch64
            target-suffix: unknown-linux-gnu
          - runner: [self-hosted, macOS, ARM64]
            arch: x86_64
            target-suffix: apple-darwin
          - runner: [self-hosted, macOS, ARM64]
            arch: aarch64
            target-suffix: apple-darwin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: true
      - id: update-version
        run: sed -i'' -e "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" Cargo.toml
      - id: build
        shell: bash
        run: |
          export TARGET="${{ matrix.arch }}-${{ matrix.target-suffix }}"
          rustup target add "${TARGET}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            cargo build --release --target "${TARGET}"
          else
            # kache is installed on the host by Hermit but is unavailable
            # inside cross's Linux build containers. Hermit sets it through
            # RUSTC_WRAPPER, which overrides any cargo config, so clear that.
            RUSTC_WRAPPER= cross build --release --target "${TARGET}"
          fi
          export TARGET_PATH="target/${TARGET}/release/bit-${TARGET}"
          mv "target/${TARGET}"/release/bit "${TARGET_PATH}"
          bzip2 -f9 "${TARGET_PATH}"
          echo "TARGET_PATH=${TARGET_PATH}.bz2" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bit-${{ matrix.arch }}-${{ matrix.target-suffix }}
          path: ${{ steps.build.outputs.TARGET_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
      - run: bin/bit release-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh release create ${{ github.ref_name }} bit-*.bz2 --title ${{ github.ref_name }} --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
