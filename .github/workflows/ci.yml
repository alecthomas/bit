name: CI
on:
  push:
    branches: ["master"]
  pull_request:
  # Fills the day's build cache on the default branch, so the first branch
  # builds each day do not start empty. Off the hour, when GitHub delays
  # scheduled runs most.
  schedule:
    - cron: "17 0 * * *"
env:
  # bit's build cache, kache's compiler cache, Hermit's installed packages,
  # Go's build cache, which the integration tests share between scripts, and
  # Cargo's registry, which Hermit keeps under CARGO_HOME in the checkout.
  BUILD_CACHE_PATHS: |
    ~/.cache/bit
    ~/.cache/kache
    ~/.cache/hermit/pkg
    ~/.cache/go-build
    .hermit/rust/registry
# Only the default branch saves the build cache, so every branch restores its
# latest entry and branches never evict it with entries nothing else reads.
# Keys include the UTC date and never fall back to an earlier day, so the
# cache starts empty each day instead of accumulating old builds.
jobs:
  default:
    name: "default"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - id: cache-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: build-default-${{ steps.cache-day.outputs.day }}-${{ github.sha }}
          restore-keys: |
            build-default-${{ steps.cache-day.outputs.day }}-
      # Use the Hermit-pinned bit rather than one built from this checkout.
      - run: "bin/bit clippy fmt-check s3-cache-test s3-test"
      # The build leaves kache's daemon running, and its writes to the cache
      # make tar fail the save. Stopping it waits until it releases the cache.
      - if: github.ref == 'refs/heads/master'
        run: bin/kache daemon stop
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/save@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: build-default-${{ steps.cache-day.outputs.day }}-${{ github.sha }}
